<script>
  const $ = (id) => document.getElementById(id);

  function readForm() {
    return {
      name: $("name").value.trim() || "名無し",
      dice: $("dice").value.trim() || "1d10",
      race: $("race").value.trim(),
      skill: $("skill").value.trim(),
      nature: $("nature").value.trim(),
      bg: $("bg").value.trim(),
    };
  }

  // ココフォリアの「キャラ編集＞メモ欄」に貼る用（実運用の本命）
  function buildMemoText(f) {
    const lines = [
      `【システム】ケダモノオペラ`,
      `【ダイス】${f.dice}（高いほど良い）`,
      f.race ? `【種族】${f.race}` : null,
      f.skill ? `【技】${f.skill}` : null,
      f.nature ? `【性質】${f.nature}` : null,
      ``,
      f.bg ? `【背景】\n${f.bg}` : `【背景】（未入力）`,
    ].filter(Boolean);

    return lines.join("\n");
  }

  // 手入力支援：短い1行にする（チャット貼り付けや共有にも便利）
  function buildOneLine(f) {
    const parts = [
      `名前:${f.name}`,
      f.race ? `種族:${f.race}` : null,
      f.skill ? `技:${f.skill}` : null,
      f.nature ? `性質:${f.nature}` : null,
      `ダイス:${f.dice}`,
    ].filter(Boolean);
    return parts.join(" / ");
  }

  // 将来インポート仕様が復活した時に備えてJSONも一応“それっぽく”保つ
  function buildCocofoliaCharacterJSON(f) {
    return {
      kind: "character",
      data: {
        name: f.name,
        memo: buildMemoText(f),
        // ✅ status（単数）が一般的。あなたの statuses は互換性を落とすので修正
        status: [],
        params: [
          f.race ? { label: "種族", value: f.race } : null,
          f.skill ? { label: "技", value: f.skill } : null,
          f.nature ? { label: "性質", value: f.nature } : null,
          { label: "ダイス", value: f.dice },
        ].filter(Boolean),
      },
    };
  }

  function updatePreview() {
    const f = readForm();
    const obj = buildCocofoliaCharacterJSON(f);
    $("out").textContent = JSON.stringify(obj, null, 2);

    // 手順ガイドも更新（プレイヤーが迷わない）
    const guide = [
      `【ココフォリア貼り付け手順】`,
      `1) 部屋でキャラクター（駒）を新規作成（空でOK）`,
      `2) キャラ編集を開く`,
      `3) 「メモ」欄に『メモ全文』を貼る`,
      `4) 必要なら種族/技/性質は params（項目）に手入力`,
      ``,
      `（コピペ用1行）`,
      buildOneLine(f),
    ].join("\n");
    const guideEl = document.getElementById("guide");
    if (guideEl) guideEl.textContent = guide;
  }

  function downloadJSON() {
    const f = readForm();
    const obj = buildCocofoliaCharacterJSON(f);
    const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    const safeName = (obj.data.name || "character").replace(/[\\/:*?"<>|]/g, "_");
    a.download = `kedamonoopera_${safeName}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  async function copyToClipboard(text, okMsg) {
    try {
      await navigator.clipboard.writeText(text);
      alert(okMsg);
    } catch {
      // クリップボードAPIが弾かれる環境向けフォールバック
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      alert(okMsg + "（フォールバック）");
    }
  }

  function copyMemo() {
    const f = readForm();
    copyToClipboard(buildMemoText(f), "メモ全文をコピーしました。ココフォリアの「メモ欄」に貼ってね。");
  }

  function copyOneLine() {
    const f = readForm();
    copyToClipboard(buildOneLine(f), "1行サマリをコピーしました。共有や手入力補助にどうぞ。");
  }

  // 既存ボタンに紐付け（IDはあなたのHTMLをそのまま使う）
  $("btnPreview").addEventListener("click", updatePreview);
  $("btnDownload").addEventListener("click", downloadJSON);

  // 既存の btnCopy を「メモ全文コピー」にする
  $("btnCopy").addEventListener("click", copyMemo);

  // 追加ボタンを動的に差し込む（HTMLをいじらず増やせる）
  (function injectExtraButton(){
    const btns = document.querySelector(".btns");
    if (!btns) return;

    const b = document.createElement("button");
    b.type = "button";
    b.id = "btnCopyOneLine";
    b.textContent = "1行サマリをコピー";
    b.addEventListener("click", copyOneLine);
    btns.appendChild(b);
  })();

  // 手順ガイド欄を動的に追加（HTMLをいじらず増やせる）
  (function injectGuide(){
    const out = document.getElementById("out");
    if (!out) return;

    const h2 = document.createElement("h2");
    h2.textContent = "ココフォリア貼り付け手順（コピペ用）";

    const pre = document.createElement("pre");
    pre.id = "guide";
    pre.style.background = "#f6f6f6";
    pre.style.padding = "12px";
    pre.style.overflow = "auto";

    out.parentNode.insertBefore(h2, out.nextSibling);
    out.parentNode.insertBefore(pre, h2.nextSibling);
  })();

  updatePreview();
</script>
